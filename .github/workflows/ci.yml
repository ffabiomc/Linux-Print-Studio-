name: C++ GTK CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout --signal=TERM --kill-after=10s 600s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends cmake ninja-build g++ pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev libcairo2-dev libcups2-dev libgnutls28-dev libavahi-client-dev gettext desktop-file-utils xvfb xauth dbus-x11
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: |
          python3 -m py_compile scripts/lps scripts/lps-receive
          sh -n scripts/lps-virtual-printer
          ctest --test-dir build --output-on-failure
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            msgfmt --check-format -o /dev/null "po/$lang.po"
            test -s "build/locale/$lang/LC_MESSAGES/linux-print-studio.mo"
          done
          desktop-file-validate data/io.github.ffabiomc.LinuxPrintStudio.desktop
      - name: Graphical startup smoke test
        run: |
          timeout 30s xvfb-run -a dbus-run-session -- env LPS_SMOKE_TEST=1 GSK_RENDERER=cairo ./build/linux-print-studio
          timeout 30s xvfb-run -a dbus-run-session -- env LPS_SMOKE_TEST=1 ADW_DEBUG_COLOR_SCHEME=prefer-dark GSK_RENDERER=cairo ./build/linux-print-studio
      - name: Package Debian
        run: |
          mkdir -p pkg/DEBIAN
          DESTDIR="$PWD/pkg" cmake --install build --prefix /usr
          printf 'Package: linux-print-studio-cpp\nVersion: 1.0.2-${{ github.run_number }}\nArchitecture: amd64\nMaintainer: Linux Print Studio\nDepends: libgtk-4-1, libadwaita-1-0, libpoppler-glib8, libcups2, libcairo2, cups-client, python3, systemd, pkexec\nDescription: Linux Print Studio GTK edition\n' > pkg/DEBIAN/control
          dpkg-deb --root-owner-group --build pkg linux-print-studio-cpp_1.0.2-${{ github.run_number }}_amd64.deb
          sudo apt-get install -y ./linux-print-studio-cpp_*.deb
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            test -s "/usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" || { echo "Missing installed catalog: $lang"; exit 1; }
          done
          timeout 30s xvfb-run -a dbus-run-session -- env LPS_SMOKE_TEST=1 GSK_RENDERER=cairo /usr/bin/linux-print-studio
          sha256sum *.deb > SHA256SUMS-deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-deb-build-${{ github.run_number }}
          path: |
            *.deb
            SHA256SUMS-deb

  fedora-rpm:
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora dependencies
        run: dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config gtk4-devel libadwaita-devel poppler-glib-devel cairo-devel cups-devel rpm-build gettext desktop-file-utils xorg-x11-server-Xvfb dbus-daemon
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: |
          python3 -m py_compile scripts/lps scripts/lps-receive
          sh -n scripts/lps-virtual-printer
          ctest --test-dir build --output-on-failure
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            msgfmt --check-format -o /dev/null "po/$lang.po"
            test -s "build/locale/$lang/LC_MESSAGES/linux-print-studio.mo"
          done
          desktop-file-validate data/io.github.ffabiomc.LinuxPrintStudio.desktop
      - name: Graphical startup smoke test
        run: |
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            test -S /tmp/.X11-unix/X99 && break
            kill -0 "$xvfb_pid" || exit 1
            sleep 0.2
          done
          test -S /tmp/.X11-unix/X99
          timeout 30s dbus-run-session -- env DISPLAY=:99 LPS_SMOKE_TEST=1 GSK_RENDERER=cairo ./build/linux-print-studio
      - name: Package RPM
        run: |
          mkdir -p staging
          DESTDIR="$PWD/staging" cmake --install build --prefix /usr
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/linux-print-studio-cpp.spec <<'SPEC'
          Name: linux-print-studio-cpp
          Version: 1.0.2
          Release: ${{ github.run_number }}%{?dist}
          Summary: Linux Print Studio GTK edition
          License: MIT
          BuildArch: x86_64
          AutoReqProv: yes
          Requires: cups, python3, systemd, polkit
          %description
          Native GTK4 PDF printing studio for Linux.
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 0755 %{_topdir}/../../staging/usr/bin/linux-print-studio %{buildroot}/usr/bin/linux-print-studio
          mkdir -p %{buildroot}/usr/share/locale
          cp -a %{_topdir}/../../staging/usr/share/locale/. %{buildroot}/usr/share/locale/
          %find_lang linux-print-studio
          mkdir -p %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/scalable/apps
          install -m 0644 %{_topdir}/../../staging/usr/share/applications/io.github.ffabiomc.LinuxPrintStudio.desktop %{buildroot}/usr/share/applications/
          install -m 0644 %{_topdir}/../../staging/usr/share/icons/hicolor/scalable/apps/io.github.ffabiomc.LinuxPrintStudio.svg %{buildroot}/usr/share/icons/hicolor/scalable/apps/
          install -m 0755 %{_topdir}/../../staging/usr/bin/lps-virtual-printer %{buildroot}/usr/bin/lps-virtual-printer
          mkdir -p %{buildroot}/usr/lib/cups/backend
          install -m 0700 %{_topdir}/../../staging/usr/lib/cups/backend/lps %{buildroot}/usr/lib/cups/backend/lps
          install -m 0755 %{_topdir}/../../staging/usr/bin/lps-receive %{buildroot}/usr/bin/lps-receive
          mkdir -p %{buildroot}/usr/lib/systemd/user
          install -m 0644 %{_topdir}/../../staging/usr/lib/systemd/user/lps-receive.service %{buildroot}/usr/lib/systemd/user/
          %files -f linux-print-studio.lang
          /usr/bin/lps-receive
          /usr/lib/systemd/user/lps-receive.service
          %attr(0700,root,root) /usr/lib/cups/backend/lps
          /usr/bin/lps-virtual-printer
          /usr/share/applications/io.github.ffabiomc.LinuxPrintStudio.desktop
          /usr/share/icons/hicolor/scalable/apps/io.github.ffabiomc.LinuxPrintStudio.svg
          /usr/bin/linux-print-studio
          SPEC
          sed -i "s|%{_topdir}/../../staging|$PWD/staging|" rpmbuild/SPECS/linux-print-studio-cpp.spec
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/linux-print-studio-cpp.spec
          cp rpmbuild/RPMS/x86_64/*.rpm .
          rpm -qlp ./linux-print-studio-cpp-*.rpm > rpm-files.txt
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            grep -Fx "/usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" rpm-files.txt
          done
          printf '%%_install_langs all\n' > /etc/rpm/macros.image-language-conf
          rpm --eval '%_install_langs'
          dnf install -y ./linux-print-studio-cpp-*.rpm
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            test -s "/usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" || { echo "Missing installed catalog: $lang"; exit 1; }
          done
          sha256sum *.rpm > SHA256SUMS-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-fedora-rpm-build-${{ github.run_number }}
          path: |
            *.rpm
            SHA256SUMS-rpm

  memory-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build and analysis dependencies
        run: |
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout --signal=TERM --kill-after=10s 600s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends cmake ninja-build g++ clang-tidy pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev libcairo2-dev libcups2-dev libgnutls28-dev libavahi-client-dev
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrumented binaries
        run: cmake --build build-sanitize --parallel 2
      - name: Run instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Static analysis (core and tests)
        run: |
          test -f build-sanitize/compile_commands.json
          timeout --signal=TERM --kill-after=10s 180s clang-tidy -p build-sanitize src/core.cpp tests/core_tests.cpp --checks='-*,clang-analyzer-*,bugprone-*,cert-*' --header-filter='^(.*/)?(src|include|tests)/' --warnings-as-errors='clang-analyzer-*,bugprone-*' 2>&1 | tee clang-tidy.log
          test ${PIPESTATUS[0]} -eq 0

  opensuse-rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: opensuse/tumbleweed
    steps:
      - name: Dependencies
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive dup --allow-downgrade --no-recommends
          zypper --non-interactive install git gzip tar gcc-c++ cmake ninja pkg-config gtk4-devel libadwaita-devel libpoppler-glib-devel cairo-devel cups-devel rpm-build gettext-tools desktop-file-utils python3
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLPS_CUPS_BACKEND_DIR=lib/cups/backend
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          desktop-file-validate data/io.github.ffabiomc.LinuxPrintStudio.desktop
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            msgfmt --check-format -o /dev/null "po/$lang.po"
          done
      - name: Package
        run: |
          mkdir -p staging rpmbuild/SPECS
          DESTDIR="$PWD/staging" cmake --install build
          cat > rpmbuild/SPECS/linux-print-studio-cpp.spec <<'SPEC'
          Name: linux-print-studio-cpp
          Version: 1.0.2
          Release: ${{ github.run_number }}.opensuse
          Summary: Linux Print Studio GTK edition
          License: MIT
          BuildArch: x86_64
          Requires: cups, python3, systemd, polkit
          %description
          Native GTK4 PDF printing studio for Linux.
          %install
          mkdir -p %{buildroot}
          cp -a %{staging}/. %{buildroot}/
          %files
          /usr/bin/linux-print-studio
          /usr/bin/lps-virtual-printer
          /usr/bin/lps-receive
          %attr(0700,root,root) /usr/lib/cups/backend/lps
          /usr/lib/systemd/user/lps-receive.service
          /usr/share/applications/io.github.ffabiomc.LinuxPrintStudio.desktop
          /usr/share/icons/hicolor/scalable/apps/io.github.ffabiomc.LinuxPrintStudio.svg
          /usr/share/locale/*/LC_MESSAGES/linux-print-studio.mo
          SPEC
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "staging $PWD/staging" rpmbuild/SPECS/linux-print-studio-cpp.spec
          cp rpmbuild/RPMS/x86_64/*.rpm .
          zypper --non-interactive --no-gpg-checks install ./*.rpm
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            test -s "/usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" || { echo "Missing installed catalog: $lang"; exit 1; }
          done
          sha256sum *.rpm > SHA256SUMS-opensuse
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-opensuse-rpm-build-${{ github.run_number }}
          path: |
            *.rpm
            SHA256SUMS-opensuse

  arch-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
    steps:
      - name: Dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja gtk4 libadwaita poppler-glib cairo cups gettext desktop-file-utils python polkit
      - uses: actions/checkout@v4
      - name: Build native package
        shell: bash
        run: |
          useradd -m builder
          mkdir -p /tmp/lps-build
          cp -a . /tmp/lps-build/
          cd /tmp/lps-build
          cat > PKGBUILD <<'PKG'
          pkgname=linux-print-studio-cpp
          pkgver=1.0.2
          pkgrel=${{ github.run_number }}
          pkgdesc='Native GTK4 PDF printing studio'
          arch=('x86_64')
          url='https://github.com/ffabiomc/Linux-Print-Studio-'
          license=('MIT')
          depends=('gtk4' 'libadwaita' 'poppler-glib' 'cairo' 'cups' 'python' 'systemd' 'polkit')
          makedepends=('cmake' 'ninja' 'gettext' 'desktop-file-utils')
          build() {
            cmake -S "$startdir" -B "$srcdir/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DLPS_CUPS_BACKEND_DIR=lib/cups/backend
            cmake --build "$srcdir/build" --parallel 2
          }
          check() {
            ctest --test-dir "$srcdir/build" --output-on-failure
            desktop-file-validate "$startdir/data/io.github.ffabiomc.LinuxPrintStudio.desktop"
            for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
              msgfmt --check-format -o /dev/null "$startdir/po/$lang.po"
            done
          }
          package() {
            DESTDIR="$pkgdir" cmake --install "$srcdir/build"
          }
          PKG
          chown -R builder:builder /tmp/lps-build
          runuser -u builder -- makepkg --noconfirm
          mainpkg=$(find . -maxdepth 1 -name 'linux-print-studio-cpp-1*.pkg.tar.zst' -print -quit)
          test -n "$mainpkg"
          bsdtar -tf "$mainpkg" > arch-files.txt
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            grep -Fx "usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" arch-files.txt
          done
          sed -i '/^[[:space:]]*NoExtract[[:space:]]*=/d' /etc/pacman.conf
          pacman-conf NoExtract
          pacman -U --noconfirm "$mainpkg"
          for lang in pt_BR pt_PT es fr de it ru zh_CN ja ko ar fi sv; do
            test -s "/usr/share/locale/$lang/LC_MESSAGES/linux-print-studio.mo" || { echo "Missing installed catalog: $lang"; exit 1; }
          done
          cp "$mainpkg" "$GITHUB_WORKSPACE/"
          cd "$GITHUB_WORKSPACE"
          sha256sum *.pkg.tar.zst > SHA256SUMS-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-arch-build-${{ github.run_number }}
          path: |
            *.pkg.tar.zst
            SHA256SUMS-arch
