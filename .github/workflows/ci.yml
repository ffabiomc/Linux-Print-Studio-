name: C++ GTK CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev libcairo2-dev libcups2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package Debian
        run: |
          cmake --install build --prefix staging/usr
          mkdir -p pkg/DEBIAN pkg/usr
          cp -a staging/usr/. pkg/usr/
          printf 'Package: linux-print-studio-cpp\nVersion: 1.0.0\nArchitecture: amd64\nMaintainer: Linux Print Studio\nDepends: libgtk-4-1, libadwaita-1-0, libpoppler-glib8, libcups2, libcairo2\nDescription: Linux Print Studio GTK edition\n' > pkg/DEBIAN/control
          dpkg-deb --build pkg linux-print-studio-cpp_1.0.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-deb
          path: '*.deb'
