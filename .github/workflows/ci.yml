name: C++ GTK CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout --signal=TERM --kill-after=10s 600s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends cmake ninja-build g++ pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev libcairo2-dev libcups2-dev libgnutls28-dev libavahi-client-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package Debian
        run: |
          cmake --install build --prefix staging/usr
          mkdir -p pkg/DEBIAN pkg/usr
          cp -a staging/usr/. pkg/usr/
          printf 'Package: linux-print-studio-cpp\nVersion: 1.0.2\nArchitecture: amd64\nMaintainer: Linux Print Studio\nDepends: libgtk-4-1, libadwaita-1-0, libpoppler-glib8, libcups2, libcairo2\nDescription: Linux Print Studio GTK edition\n' > pkg/DEBIAN/control
          dpkg-deb --build pkg linux-print-studio-cpp_1.0.2_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-deb
          path: '*.deb'

  fedora-rpm:
    runs-on: ubuntu-24.04
    container:
      image: fedora:42
    steps:
      - uses: actions/checkout@v4
      - name: Install Fedora dependencies
        run: dnf install -y gcc-c++ cmake ninja-build pkgconf-pkg-config gtk4-devel libadwaita-devel poppler-glib-devel cairo-devel cups-devel rpm-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package RPM
        run: |
          mkdir -p staging
          DESTDIR="$PWD/staging" cmake --install build --prefix /usr
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/linux-print-studio-cpp.spec <<'SPEC'
          Name: linux-print-studio-cpp
          Version: 1.0.2
          Release: 1%{?dist}
          Summary: Linux Print Studio GTK edition
          License: MIT
          BuildArch: x86_64
          AutoReqProv: yes
          %description
          Native GTK4 PDF printing studio for Linux.
          %install
          mkdir -p %{buildroot}/usr/bin
          install -m 0755 %{_topdir}/../../staging/usr/bin/linux-print-studio %{buildroot}/usr/bin/linux-print-studio
          %files
          /usr/bin/linux-print-studio
          SPEC
          sed -i "s|%{_topdir}/../../staging|$PWD/staging|" rpmbuild/SPECS/linux-print-studio-cpp.spec
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/linux-print-studio-cpp.spec
          cp rpmbuild/RPMS/x86_64/*.rpm .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-print-studio-cpp-fedora-rpm
          path: '*.rpm'

  memory-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and analysis dependencies
        run: |
          sudo timeout --signal=TERM --kill-after=10s 150s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo timeout --signal=TERM --kill-after=10s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends cmake ninja-build g++ clang-tidy pkg-config libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev libcairo2-dev libcups2-dev libgnutls28-dev libavahi-client-dev
      - name: Configure with AddressSanitizer and UndefinedBehaviorSanitizer
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build instrumented binaries
        run: cmake --build build-sanitize --parallel 2
      - name: Run instrumented tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
      - name: Static analysis (core and tests)
        run: |
          test -f build-sanitize/compile_commands.json
          timeout --signal=TERM --kill-after=10s 180s clang-tidy -p build-sanitize src/core.cpp tests/core_tests.cpp --checks='-*,clang-analyzer-*,bugprone-*,cert-*' --header-filter='^(.*/)?(src|include|tests)/' --warnings-as-errors='clang-analyzer-*,bugprone-*' 2>&1 | tee clang-tidy.log
          test ${PIPESTATUS[0]} -eq 0
